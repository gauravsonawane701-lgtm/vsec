<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Database Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">
    <div class="letterhead">
      <h1>Student Database Manager</h1>
      <span class="tag">Register No. 001</span>
    </div>

    <div class="card">
      <h2>New Entry</h2>
      <div class="field-row">
        <div class="field">
          <label for="name">Student Name</label>
          <input type="text" id="name" placeholder="e.g. Aarav Sharma">
        </div>
        <div class="field">
          <label for="maths">Maths (/100)</label>
          <input type="number" id="maths" min="0" max="100">
        </div>
        <div class="field">
          <label for="science">Science (/100)</label>
          <input type="number" id="science" min="0" max="100">
        </div>
        <div class="field">
          <label for="english">English (/100)</label>
          <input type="number" id="english" min="0" max="100">
        </div>
      </div>
      <button onclick="addStudent()">Add to Register</button>
    </div>

    <div class="card">
      <h2>Class Register</h2>
      <div class="topper-banner" id="topperBanner">
        <span class="medal">🏅</span>
        <span id="topperText"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Maths</th>
            <th>Science</th>
            <th>English</th>
            <th>Total</th>
            <th>%</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <tr id="emptyRow">
            <td colspan="8" class="empty-note">No students added yet — fill the form above and click "Add to Register".</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>Totals are out of 300 marks &middot; Percentage = Total / 300 &times; 100</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
